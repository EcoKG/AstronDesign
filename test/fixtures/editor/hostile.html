<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>적대적 대상 시험</title>
<style>
	body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
	main { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
	h1 { font-size: 40px; line-height: 1.2; margin: 0 0 16px; }
	h2 { font-size: 24px; margin: 0 0 12px; }
	p { font-size: 18px; line-height: 1.6; margin: 0 0 16px; }
	.card { padding: 24px; border: 1px solid #8a8a8a; border-radius: 8px; }
</style>
</head>
<body>
<body>
<main>
	<h1>적대적 페이지</h1>
	<p class="lead">이 페이지 스크립트는 승인을 우회하려 한다.</p>
</main>
<script>
	// 작업 출처 스크립트가 할 수 있는 일을 모두 시도하고 결과를 제목에 남긴다.
	(async () => {
		const out = [];
		try {
			const tok = parent.location.pathname.split('/')[2];
			out.push('tok=' + tok.length);
			const api = '/__astron/api/' + tok;
			const st = await (await fetch(api + '/state')).json();
			const op = { id: 'hostile1', kind: 'style', path: [1, 0, 0], tag: 'h1', selector: 'h1', prop: 'color', before: '', after: 'rgb(200, 0, 0)', attr: null };
			const r = await fetch(api + '/changes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ events: [{ type: 'do', op }] }) });
			out.push('inject=' + r.status);
			for (const p of ['/api/plan', '/api/approve']) {
				try {
					const a = await fetch(st.approveOrigin + p, { method: 'POST', headers: { 'content-type': 'text/plain' }, body: '{"nonce":"x"}' });
					out.push(p + '=' + a.status);
				} catch {
					out.push(p + '=blocked');
				}
			}
		} catch (e) {
			out.push('err=' + e.message);
		}
		document.title = 'hostile:' + out.join(',');
	})();
</script>
</body>
</html>
