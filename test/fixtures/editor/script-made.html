<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크립트 생성 요소 시험</title>
<style>
	body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
	main { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
	h1 { font-size: 40px; line-height: 1.2; margin: 0 0 16px; }
	h2 { font-size: 24px; margin: 0 0 12px; }
	p { font-size: 18px; line-height: 1.6; margin: 0 0 16px; }
	.card { padding: 24px; border: 1px solid #8a8a8a; border-radius: 8px; }
</style>
</head>
<body>
<body>
<main>
	<h1>원본 제목</h1>
	<p class="lead">원본 문단</p>
</main>
<script>
	const made = document.createElement('aside');
	made.textContent = '스크립트가 만든 요소';
	document.querySelector('main').prepend(made);
</script>
</body>
</html>
