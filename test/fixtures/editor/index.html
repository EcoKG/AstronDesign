<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편집기 시험 페이지</title>
<style>
	body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
	main { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
	h1 { font-size: 40px; line-height: 1.2; margin: 0 0 16px; }
	h2 { font-size: 24px; margin: 0 0 12px; }
	p { font-size: 18px; line-height: 1.6; margin: 0 0 16px; }
	.card { padding: 24px; border: 1px solid #8a8a8a; border-radius: 8px; }
</style>
</head>
<body>
<main>
	<h1>주문 현황</h1>
	<p class="lead">오늘 들어온 주문 12건을 처리했습니다.</p>
	<p class="low" style="color: #b3b3b3">처리 대기 3건은 내일 오전에 확인합니다.</p>
	<section class="card">
		<h2>요약</h2>
		<ul><li>완료 9건</li><li>대기 3건</li></ul>
		<img src="chart.svg" alt="주간 주문 추이" width="240" height="80">
	</section>
</main>
</body>
</html>
