<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstronDesign 편집기</title>
<link rel="stylesheet" href="editor.css">
<script type="module" src="app.js"></script>
</head>
<body data-ready="0" data-mode="edit">
<svg class="sprite" aria-hidden="true" focusable="false">
	<symbol id="i-pointer" viewBox="0 0 20 20"><path d="M5.5 3.5l10 6.2-4.6 1.2-2.3 4.6z"/></symbol>
	<symbol id="i-comment" viewBox="0 0 20 20"><path d="M4.5 4h11a1.5 1.5 0 011.5 1.5v6.5a1.5 1.5 0 01-1.5 1.5H9.5L6 16.5v-3H4.5A1.5 1.5 0 013 12V5.5A1.5 1.5 0 014.5 4z"/></symbol>
	<symbol id="i-hand" viewBox="0 0 20 20"><path d="M7 10.5V5a1.25 1.25 0 012.5 0v4.5M9.5 9V3.75a1.25 1.25 0 012.5 0V9M12 9V5a1.25 1.25 0 012.5 0v6.5c0 3.3-2.3 5.5-5.2 5.5-2.2 0-3.4-1-4.5-2.8l-1.6-2.6a1.2 1.2 0 011.9-1.4L7 12"/></symbol>
	<symbol id="i-minus" viewBox="0 0 20 20"><path d="M5 10h10"/></symbol>
	<symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 5v10M5 10h10"/></symbol>
	<symbol id="i-fit" viewBox="0 0 20 20"><path d="M3.5 7.5v-4h4M12.5 3.5h4v4M16.5 12.5v4h-4M7.5 16.5h-4v-4"/></symbol>
	<symbol id="i-undo" viewBox="0 0 20 20"><path d="M7.5 4.5L4 8l3.5 3.5M4 8h7.5a4.25 4.25 0 010 8.5H9"/></symbol>
	<symbol id="i-redo" viewBox="0 0 20 20"><path d="M12.5 4.5L16 8l-3.5 3.5M16 8H8.5a4.25 4.25 0 000 8.5H11"/></symbol>
	<symbol id="i-layers" viewBox="0 0 20 20"><path d="M10 3.5l7 3.75-7 3.75-7-3.75zM3 11.25L10 15l7-3.75"/></symbol>
	<symbol id="i-panel" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="1.5"/><path d="M12 4v12"/></symbol>
</svg>
<header class="topbar">
	<button id="toggle-layers" class="icon-btn drawer-toggle" type="button" aria-controls="layers-panel" aria-expanded="true" aria-label="아트보드·레이어 패널"><svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg></button>
	<span class="brand">AstronDesign</span>
	<span id="target-name" class="target"></span>
	<span class="spacer"></span>
	<span id="open-count" class="pill">열린 댓글 0</span>
	<span id="blocked" class="pill" title="대상 CSP 가 막은 외부 요청 수">차단 0건</span>
	<span id="save-state" class="pill" data-state="idle" role="status">저장할 편집 없음</span>
	<span id="applied" class="pill applied" role="status" hidden></span>
	<span id="apply-slot"></span>
	<button id="toggle-side" class="icon-btn drawer-toggle" type="button" aria-controls="side" aria-expanded="true" aria-label="속성·댓글 패널"><svg class="icon" aria-hidden="true"><use href="#i-panel"/></svg></button>
</header>
<div class="workspace">
	<nav id="layers-panel" class="panel" aria-label="아트보드와 레이어">
		<h2 id="boards-title">아트보드</h2>
		<div id="boards" class="board-list" role="group" aria-labelledby="boards-title"></div>
		<h2 id="layers-title">레이어</h2>
		<ul id="layers" role="tree" aria-labelledby="layers-title"></ul>
	</nav>
	<main id="canvas" aria-label="캔버스" tabindex="-1">
		<div id="world"></div>
		<div id="overlay" aria-hidden="true">
			<div id="hover-box"></div>
			<div id="ghosts"></div>
			<div id="sel-box" hidden><span class="tag"></span><span class="handle"></span></div>
			<div id="markers"></div>
		</div>
		<div id="labels"></div>
		<div id="toolbar" role="toolbar" aria-label="캔버스 도구">
			<button id="mode-edit" class="tool" type="button" aria-pressed="true" aria-label="편집" aria-keyshortcuts="V" title="편집 (V)"><svg class="icon" aria-hidden="true"><use href="#i-pointer"/></svg></button>
			<button id="mode-comment" class="tool" type="button" aria-pressed="false" aria-label="댓글" aria-keyshortcuts="C" title="댓글 (C)"><svg class="icon" aria-hidden="true"><use href="#i-comment"/></svg></button>
			<button id="tool-hand" class="tool" type="button" aria-pressed="false" aria-label="손 도구(화면 이동)" aria-keyshortcuts="H" title="손 도구 (H · 스페이스를 누른 채 끌기)"><svg class="icon" aria-hidden="true"><use href="#i-hand"/></svg></button>
			<span class="sep" aria-hidden="true"></span>
			<button id="zoom-out" class="tool" type="button" aria-label="축소" aria-keyshortcuts="Control+-" title="축소 (Ctrl+-)"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
			<span id="zoom-label" class="zoom-label" aria-live="polite">100%</span>
			<button id="zoom-in" class="tool" type="button" aria-label="확대" aria-keyshortcuts="Control+=" title="확대 (Ctrl+=)"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
			<button id="zoom-fit" class="tool" type="button" aria-label="모든 보드 맞춤" aria-keyshortcuts="Control+0 Shift+1" title="모든 보드 맞춤 (Ctrl+0 · Shift+1), 활성 보드 맞춤 Shift+2"><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
			<span class="sep" aria-hidden="true"></span>
			<button id="undo" class="tool" type="button" disabled aria-label="되돌리기" aria-keyshortcuts="Control+Z" title="되돌리기 (Ctrl+Z)"><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg></button>
			<button id="redo" class="tool" type="button" disabled aria-label="다시 하기" aria-keyshortcuts="Control+Shift+Z" title="다시 하기 (Ctrl+Shift+Z)"><svg class="icon" aria-hidden="true"><use href="#i-redo"/></svg></button>
		</div>
		<p id="warnings" class="warnings" role="alert" hidden></p>
	</main>
	<aside id="side" class="panel" aria-label="속성과 댓글">
		<section id="props" aria-labelledby="props-title">
			<h2 id="props-title">속성</h2>
			<p id="p-empty" class="muted">캔버스나 레이어에서 요소를 고르십시오.</p>
			<form id="p-form" hidden>
				<p id="p-selector" class="selector"></p>
				<label class="field" id="p-text-field">글자<textarea id="p-text" rows="2"></textarea></label>
				<div class="row2">
					<label class="field">글자색<span class="swatch"><input id="p-color" type="color" aria-describedby="p-color-note"></span><span id="p-color-note" class="swatch-note"></span></label>
					<label class="field">배경<span class="swatch"><input id="p-background-color" type="color" aria-describedby="p-background-color-note"></span><span id="p-background-color-note" class="swatch-note"></span></label>
				</div>
				<p id="contrast" class="contrast" aria-live="polite"></p>
				<div class="row2">
					<label class="field">글자 크기<input id="p-font-size" type="text" inputmode="decimal"></label>
					<label class="field">굵기<select id="p-font-weight"><option>400</option><option>500</option><option>600</option><option>700</option><option>800</option></select></label>
				</div>
				<div class="row2">
					<label class="field">너비<input id="p-width" type="text"></label>
					<label class="field">높이<input id="p-height" type="text"></label>
				</div>
				<label class="field">이동(translate)<input id="p-translate" type="text" placeholder="0px 0px"></label>
				<div class="seg align" role="group" aria-label="글자 정렬">
					<button type="button" data-align="left">왼쪽</button>
					<button type="button" data-align="center">가운데</button>
					<button type="button" data-align="right">오른쪽</button>
				</div>
			</form>
		</section>
		<section id="comments" aria-labelledby="comments-title" hidden>
			<h2 id="comments-title">모든 댓글</h2>
			<p class="muted">캔버스에서 고칠 곳을 누르면 그 요소에 댓글이 달립니다.</p>
			<form id="c-form" hidden>
				<p id="c-target" class="selector"></p>
				<label class="field">의도<select id="c-intent"></select></label>
				<label class="field">댓글<textarea id="c-note" rows="3" maxlength="2000"></textarea></label>
				<label class="check"><input id="c-send" type="checkbox" checked>에이전트에 보내기</label>
				<div class="actions">
					<button id="c-cancel" type="button">취소</button>
					<button id="c-save" type="button" class="primary">댓글 달기</button>
				</div>
			</form>
			<ul id="comment-list"></ul>
		</section>
	</aside>
</div>
</body>
</html>
